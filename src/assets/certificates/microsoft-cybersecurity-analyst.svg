<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="sidebarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8EEF5"/>
      <stop offset="100%" stop-color="#D9E4EF"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <pattern id="guilloche" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 20 Q 10 0 20 20 T 40 20" fill="none" stroke="#E2E8F0" stroke-width="0.75" opacity="0.6"/>
      <path d="M 0 20 Q 10 40 20 20 T 40 20" fill="none" stroke="#E2E8F0" stroke-width="0.75" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="#FFFFFF"/>
  <rect x="15" y="15" width="1170" height="820" rx="8" fill="#FDFDFD" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="25" y="25" width="1150" height="800" rx="6" fill="url(#guilloche)"/>

  <!-- Left Sidebar (9 Courses) -->
  <g transform="translate(35, 35)">
    <rect width="250" height="780" rx="4" fill="url(#sidebarGrad)" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Coursera Seal Top Left -->
    <g transform="translate(125, 80)">
      <circle r="46" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
      <circle r="40" fill="none" stroke="#0F172A" stroke-width="1" stroke-dasharray="2 2"/>
      <path id="sealTextPath" d="M -32 0 A 32 32 0 1 1 32 0 A 32 32 0 1 1 -32 0" fill="none"/>
      <text font-family="system-ui, -apple-system, sans-serif" font-size="6.8" font-weight="700" fill="#0F172A" letter-spacing="1">
        <textPath href="#sealTextPath" startOffset="50%" text-anchor="middle">
          LEARNING WITHOUT LIMITS • COURSERA
        </textPath>
      </text>
      <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0056D2" text-anchor="middle" letter-spacing="-0.5">coursera</text>
      <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="5.5" font-weight="700" fill="#64748B" text-anchor="middle">PROFESSIONAL CERTIFICATE</text>
    </g>

    <!-- 9 Courses Badge -->
    <rect x="0" y="150" width="250" height="42" fill="url(#badgeGrad)"/>
    <text x="125" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">9 Courses</text>

    <!-- Course List -->
    <g transform="translate(20, 215)" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#1E293B">
      <text y="0"><tspan x="0" dy="0">Introduction to Computers</tspan><tspan x="0" dy="14">and Operating Systems</tspan></text>
      <text y="48"><tspan x="0" dy="0">Introduction to Networking</tspan><tspan x="0" dy="14">and Cloud Computing</tspan></text>
      <text y="96"><tspan x="0" dy="0">Cybersecurity Threat</tspan><tspan x="0" dy="14">Vectors and Mitigation</tspan></text>
      <text y="144"><tspan x="0" dy="0">Cybersecurity Identity and</tspan><tspan x="0" dy="14">Access Solutions (Azure AD)</tspan></text>
      <text y="192"><tspan x="0" dy="0">Cybersecurity Solutions and</tspan><tspan x="0" dy="14">Microsoft Defender</tspan></text>
      <text y="240"><tspan x="0" dy="0">Cybersecurity Tools and</tspan><tspan x="0" dy="14">Technologies</tspan></text>
      <text y="288"><tspan x="0" dy="0">Cybersecurity Management</tspan><tspan x="0" dy="14">and Compliance</tspan></text>
      <text y="336"><tspan x="0" dy="0">Advanced Cybersecurity</tspan><tspan x="0" dy="14">Concepts &amp; Capstone Project</tspan></text>
      <text y="384"><tspan x="0" dy="0">Microsoft SC-900 Exam</tspan><tspan x="0" dy="14">Preparation and Practice</tspan></text>
    </g>

    <text x="125" y="735" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" text-anchor="middle">ONLINE PROFESSIONAL CERTIFICATE</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(320, 50)">
    <!-- Microsoft Logo -->
    <g transform="translate(30, 25)">
      <!-- 4 squares -->
      <rect x="0" y="0" width="22" height="22" fill="#F25022"/>
      <rect x="26" y="0" width="22" height="22" fill="#7FBA00"/>
      <rect x="0" y="26" width="22" height="22" fill="#00A4EF"/>
      <rect x="26" y="26" width="22" height="22" fill="#FFB900"/>
      <text x="60" y="34" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="#5E5E5E" letter-spacing="-0.5">Microsoft</text>
    </g>

    <!-- Date -->
    <text x="30" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748B">Feb 27, 2026</text>

    <!-- Candidate Name -->
    <text x="30" y="225" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#0F172A">Rehan S Nair</text>

    <!-- Success Statement -->
    <text x="30" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#475569">has successfully completed the online Professional Certificate</text>

    <!-- Certificate Title -->
    <text x="30" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#0F172A" letter-spacing="-1">
      Microsoft Cybersecurity
    </text>
    <text x="30" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#0F172A" letter-spacing="-1">
      Analyst
    </text>

    <!-- Description Paragraph -->
    <g transform="translate(30, 430)" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#334155">
      <text y="0"><tspan x="0" dy="0">Learners will prepare for a new career in the high-demand field of cybersecurity with professional-level training from Microsoft — an</tspan></text>
      <text y="18"><tspan x="0" dy="0">industry-recognized leader. Through a mix of videos, assessments, and hands-on activities, you’ll learn cybersecurity concepts and</tspan></text>
      <text y="36"><tspan x="0" dy="0">how they apply to a business environment, discuss threat mitigation strategies from an enterprise perspective, apply effective</tspan></text>
      <text y="54"><tspan x="0" dy="0">cybersecurity policy measures within an Azure environment, and practice on tools like MS Defender, Azure Active Directory &amp; more.</tspan></text>
      <text y="72"><tspan x="0" dy="0">For your final project, you’ll create a cybersecurity proposal detailing the creation and protection of a business network and</tspan></text>
      <text y="90"><tspan x="0" dy="0">infrastructure. When you finish, you’ll have tangible examples to talk about in job interviews and be prepared to take the Microsoft SC-900 Exam.</tspan></text>
    </g>

    <!-- Sign-off & Verification -->
    <g transform="translate(30, 620)">
      <!-- Disclaimer text -->
      <text x="0" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#94A3B8" max-width="450">
        <tspan x="0" dy="0">This certificate attests to the learner's completion of an online program delivered via Coursera. It does not constitute formal enrollment at</tspan>
        <tspan x="0" dy="12">any university or entity and does not itself grant academic credit, grades, or a degree.</tspan>
      </text>

      <!-- Signature Section Right -->
      <g transform="translate(560, -20)">
        <!-- Signature line -->
        <path d="M 0 35 Q 25 10 50 30 T 90 20 T 130 35 T 160 15 T 190 30" fill="none" stroke="#334155" stroke-width="2"/>
        <line x1="0" y1="45" x2="210" y2="45" stroke="#CBD5E1" stroke-width="1"/>
        <text x="0" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Marni Baker-Stein</text>
        <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#64748B">Chief Content Officer, Coursera</text>
      </g>

      <!-- Verification Link Bottom Right -->
      <g transform="translate(560, 65)">
        <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#475569">Verify this certificate at:</text>
        <text x="0" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0056D2">coursera.org/verify/professional-cert/KSB6YASUVZZF</text>
      </g>
    </g>
  </g>
</svg>
